$(".RR_open_hide").click(function () {
  var id = $(this).attr("data-id");
 
  if ($("#group_"+id).hasClass("RR_hide")) {
    $("#group_"+id).removeClass("RR_hide");
  } else {
    $("#group_"+id).addClass("RR_hide");
  }
});


$("#dancer1_tri, #dancer2_tri").click(function () {
  elements = $(this).closest(".round_info").find(".all_details");

  if (elements.css("display")=="block") elements.css("display","none");
  else                                  elements.css("display","block");
});

  
var fixed_details=0;
$(".view_mode").click(function () {
  if (fixed_details) {
    fixed_details=0;
    //$(".v_det").css("display","none");
    $(".v_sum").css("display","none");
    $(".v_time").css("display","none"); 
  } else {
    fixed_details=1;
    //$(".v_det").css("display","block");
    $(".v_sum").css("display","block");
    $(".v_time").css("display","block");
  }
});
var fixed=0;

$(".fader, .f_d_1, .f_d_2, .f_d_3").click(function () {
  if (fixed) {
    fixed=0;
    fader_desc(0);
  } else {
    fixed=1;
    fader_desc(1);
  }
});
$(".fader").mouseover(function () {
  fader_desc(1);
});
$(".fader").mouseout(function () {
  if (!fixed) {
    fader_desc(0);
  }
});
function fader_desc(v) {
  if (v) {
    $(".f_d_1").html("Physical Quality");
    $(".f_d_2").html("Artistic Quality");
    $(".f_d_3").html("Interpretive Quality");  
  } else {
    $(".f_d_1").html("P");
    $(".f_d_2").html("A");
    $(".f_d_3").html("I");
  }
}

</script>
