name: Check sources

on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "17 16 * * *"     # second chance: GitHub sometimes drops a scheduled run. Does nothing if the first one ran.
  workflow_dispatch:
    inputs:
      max:
        description: Events to collect per source
        default: "10"
      full:
        description: Look at every year (backfill)
        type: boolean
        default: false

permissions:
  actions: read       # the manual run cooldown reads this workflow's past runs
  contents: write
  pages: write
  id-token: write

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Has today's run already happened?
        id: gate
        if: github.event.schedule == '17 16 * * *'
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime
          checked = [s.get("last_checked") for s in json.load(open("data/state.json"))["sources"].values() if s.get("last_checked")]
          last = max(checked, default="2000-01-01T00:00:00Z")
          hours = (datetime.datetime.now(datetime.timezone.utc) - datetime.datetime.fromisoformat(last.replace("Z", "+00:00"))).total_seconds() / 3600
          print(f"skip={'true' if hours < 12 else 'false'}")
          PY
      - name: Manual run cooldown (one every 24 hours)
        # A manual run (the site's "Manual run" button sends people to GitHub's "Run workflow") may start only
        # 24 hours after the last manual run, so the sites we read are not visited more than they need to be.
        # A run this step refuses ends as failed, and failed runs are not counted, so a refusal never restarts the clock.
        # The site's button reads the same list of runs to show how long is left (site/app.js, lastManualRun).
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/check.yml/runs?event=workflow_dispatch&per_page=20" \
            --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }} and .conclusion != "failure")][0].created_at // empty')
          [ -z "$last" ] && { echo "No earlier manual run. Going ahead."; exit 0; }
          python3 - "$last" <<'PY'
          import datetime, sys
          last = datetime.datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          left = last + datetime.timedelta(hours=24) - datetime.datetime.now(datetime.timezone.utc)
          if left.total_seconds() > 0:
              h, m = divmod(int(left.total_seconds() // 60), 60)
              print(f"::error::The last manual run started {sys.argv[1]}. Manual runs are limited to one every 24 hours; try again in {h} h {m} min.")
              sys.exit(1)
          print(f"Last manual run started {sys.argv[1]}, more than 24 hours ago. Going ahead.")
          PY
      - uses: astral-sh/setup-uv@v5
        if: steps.gate.outputs.skip != 'true'
      - run: uv sync
        if: steps.gate.outputs.skip != 'true'
      - run: uv run pytest -q
        if: steps.gate.outputs.skip != 'true'
      - name: Identify the bot for commits
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "dancebreak-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Upcoming events and headlines for the News tab
        if: steps.gate.outputs.skip != 'true'
        continue-on-error: true   # the news is extra; a failure here must not stop the scrape
        run: uv run python -m pipeline.news
      - name: Check sources and collect new events
        if: steps.gate.outputs.skip != 'true'
        env:
          PUSH_PROGRESS: "1"      # save and push every 10 events
          PYTHONUNBUFFERED: "1"   # print each event as it happens
        run: uv run python -m pipeline.check --max "${{ inputs.max || '10' }}" ${{ inputs.full && '--full' || '' }}
      - name: Save results
        if: steps.gate.outputs.skip != 'true'
        run: |
          git add data snapshots 2>/dev/null || git add data
          git diff --cached --quiet || git commit -m "Scheduled check: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

  publish:
    needs: check
    uses: ./.github/workflows/pages.yml
